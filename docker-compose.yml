# docker compose up -d --build   (set REVALIDATE_SECRET in .env)
services:
  web:
    image: ${REGISTRY:-local}/choobz-web:${TAG:-latest}
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://choobz.kids}
    init: true
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-https://choobz.kids} # must equal the build arg
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET in .env}
    volumes:
      # choobz.db, uploads/, cache/images/ and backups/ all live here.
      - choobz-data:/data
    ports:
      - "${WEB_PORT:-3000}:3000"
    stop_grace_period: 20s

  # Optional TLS reverse proxy: docker compose --profile proxy up -d
  caddy:
    image: caddy:2
    profiles: ["proxy"]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]

volumes:
  choobz-data:
  caddy-data:
  caddy-config:
